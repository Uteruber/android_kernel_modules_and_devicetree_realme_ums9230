name: Build kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libncurses-dev clang llvm lld ninja-build dwarves

      - name: Show repository structure
        run: |
          ls
          find . -maxdepth 2 -type f | sort | head -100

      - name: Build
        run: |
          make clean
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out \
            ums9230_defconfig
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out \
            -j"$(nproc)" Image.gz-dtb modules
        continue-on-error: false
